name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Check installed package in isolated mode
        run: python -I -c "import json; from inventory_lab.robust import solve; from inventory_lab.robust_demo import example; from inventory_lab.flow import simulate; from inventory_lab.flow_demo import synthetic_input; assert solve(example())['optimal']; assert simulate(json.dumps(synthetic_input()).encode())['days'] == 8"
      - name: Run model and simulation tests
        run: python -m unittest discover -s tests -v
      - name: Run result-reader tests
        run: python -m unittest discover -s examples -p test_read_flow_result.py -v
