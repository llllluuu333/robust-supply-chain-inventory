[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-chain-inventory-public"
version = "0.1.0"
description = "Research prototype for robust multi-echelon inventory optimization"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11"]

[tool.setuptools.packages.find]
include = ["inventory_lab*"]
